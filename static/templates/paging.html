{{- define "paging"}}{{$data := .}}{{if $data.PrevPage -}}
<ul class="pagination justify-content-end">
    <li class="page-item page-nav page-prev">
        <a class="page-link" href="?page={{$data.PrevPage}}{{$data.PageParams}}" aria-label="Previous page">
            <span class="page-nav-icon" aria-hidden="true">&#8592;</span>
            <span class="page-nav-label">Previous</span>
        </a>
    </li>
    {{- range $p := $data.PagingRange -}}
    <li class="page-item{{if eq $data.Page $p}} active{{end}}">
        {{- if $p}}<a class="page-link" href="?page={{$p}}{{$data.PageParams}}">{{$p}}</a>
        {{- else}}<span class="page-text">...</span>{{end -}}
    </li>{{- end -}}
    <li class="page-item page-nav page-next">
        <a class="page-link" href="?page={{$data.NextPage}}{{$data.PageParams}}" aria-label="Next page">
            <span class="page-nav-label">Next</span>
            <span class="page-nav-icon" aria-hidden="true">&#8594;</span>
        </a>
    </li>
</ul>
{{- end}}{{end -}}
