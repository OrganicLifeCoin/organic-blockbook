<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,shrink-to-fit=no">
    <link rel="stylesheet" href="/static/vendor/bootstrap-4.3.1.min.css">
    <link rel="stylesheet" href="/static/css/main.css?v=olcexplorer1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{.CoinLabel}} Explorer</title>
    <meta name="description" content="Search {{.CoinLabel}} blockchain for block, transaction, address, or xpub. You can also check network statistics.">
    <meta property="og:title" content="{{.CoinLabel}} Explorer" />
    <meta property="og:description" content="Search {{.CoinLabel}} blockchain for block, transaction, address, or xpub. You can also check network statistics." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://{{.Hostname}}{{.RelativeURL}}" />
    <meta property="og:site_name" content="{{.CoinLabel}} Explorer" />
    <meta property="og:locale" content="en" />
    <meta property="og:image" content="https://{{.Hostname}}/static/organiclifecoin-og.png">
    <meta property="og:image:alt" content="{{.CoinLabel}} Image" />
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="/static/organiclifecoin-32.png" />
</head>
<body class="d-flex flex-column">
    <header id="header" class="container-fluid bg-purple px-0">
        <nav class="navbar navbar-expand-sm navbar-dark bg-gradient site-nav-main">
            <div class="container">
                <a class="navbar-brand" href="/blocks" title="Explorer Home">
                    <div class="organiclifecoin-brand">
                        <img src="/static/organiclifecoin.png" alt="OrganicLifeCoin logo" height="56" />
                        <span class="explorer pull-left">Explorer</span>
                    </div>
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarResponsive">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/blocks">Blocks</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/status">Status</a>
                        </li>
                        <li class="nav-item d-none d-md-block">
                            <a class="nav-link" href="/sendtx">Send-TX</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <nav class="navbar navbar-expand-lg navbar-dark bg-gradient site-nav-search">
            <div class="container pb-4 pt-2">
                <form id="search" class="mx-2 my-auto d-inline w-100" action="/search" method="get">
                    <div class="input-group">
                        <label class="mr-sm-2 mb-0 sr-only" for="q">Search</label>
                        <input type="text" class="form-control rounded-left" name="q" placeholder="Search block height, hash, txid, address, or xpub" autocomplete="off" spellcheck="false">
                        <span class="input-group-append">
                            <button class="btn btn-outline-secondary" type="submit" form="search" value="Search">Search</button>
                        </span>
                    </div>
                </form>
            </div>
        </nav>
    </header>
    <main id="wrap">
        <div class="container py-3">
            {{- template "specific" . -}}
        </div>
    </main>
    <footer id="footer" class="footer bg-purple">
        <div class="container py-4">
            <div class="row align-items-center justify-content-center text-center">
                <div class="col-md-4 pb-2 pb-md-0">
                    <p class="m-0 p-0">
                        <a target="_blank" rel="noopener noreferrer" class="mx-2" href="/blocks">Blocks</a>
                        <a target="_blank" rel="noopener noreferrer" class="mx-2" href="/status">Status</a>
                        <a target="_blank" rel="noopener noreferrer" class="mx-2" href="/api/v2">API</a>
                    </p>
                </div>
                <div class="col-md-4 pb-2 pb-md-0">
                    <p class="m-0 p-0">
                        <span>© 2026 OrganicLifeCoin</span>
                    </p>
                </div>
                <div class="col-md-4 pb-2 pb-md-0">
                    <p class="m-0 p-0">
                        <a target="_blank" rel="noopener noreferrer" href="/blocks">Public Explorer</a>
                    </p>
                </div>
            </div>
        </div>
    </footer>
<script src="/static/vendor/jquery-3.5.1.slim.min.js"></script>
<script src="/static/vendor/popper-1.14.7.min.js"></script>
<script src="/static/vendor/bootstrap-4.3.1.min.js"></script>
<script>
    (function () {
        function isInteractiveTarget(target) {
            return target.closest("a, button, input, textarea, select, label");
        }

        function openRow(row) {
            var href = row.getAttribute("data-href");
            if (href) {
                window.location.assign(href);
            }
        }

        document.addEventListener("click", function (event) {
            var row = event.target.closest("tr.clickable-row[data-href]");
            if (!row || isInteractiveTarget(event.target)) {
                return;
            }
            openRow(row);
        });

        document.addEventListener("keydown", function (event) {
            if (event.key !== "Enter" && event.key !== " ") {
                return;
            }
            var row = event.target.closest("tr.clickable-row[data-href]");
            if (!row) {
                return;
            }
            event.preventDefault();
            openRow(row);
        });
    })();
</script>
</body>
</html>
